<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0E14">
<title>SENTINEL — Log Security Analyzer</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/theme.css?v=7">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">

        </svg>
      </div>
      <div>
        <div class="brand-name">SENTINEL</div>
        <div class="brand-tag">LOG SECURITY ANALYZER</div>
      </div>
    </div>

    <div class="nav-item" data-nav="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Overview</span></div>

    <div class="nav-item" data-nav="incidents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>Incidents</span></div>
    <div class="nav-item" data-nav="profiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>Risk Profiles</span></div>
    <div class="nav-item" data-nav="intel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13.5 13.5 0 010 18"/><path d="M12 3a13.5 13.5 0 000 18"/></svg><span>Threat Intel</span></div>

    <div class="nav-item" data-nav="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg><span>Reports</span></div>
    <div class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4"/><path d="M12 19v4"/><path d="M4.2 4.2l2.8 2.8"/><path d="M17 17l2.8 2.8"/><path d="M1 12h4"/><path d="M19 12h4"/><path d="M4.2 19.8L7 17"/><path d="M17 7l2.8-2.8"/></svg><span>Settings</span></div>

    <div class="rail-status" id="rail-status">Loading…</div>
    <button class="rail-reset" id="reset-btn" title="Delete the current analysis and start fresh">⟲ Reset analysis</button>
  </aside>

  <main class="main" id="view"></main>
</div>
<div id="toast"></div>
<script src="/js/app.js?v=7"></script>

</html>
